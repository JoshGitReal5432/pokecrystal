name: Build ROM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RGBDS
        run: |
          wget https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-1.0.4-linux-x86_64.tar.xz
          tar -xf rgbds-1.0.4-linux-x86_64.tar.xz
          sudo cp rgbds-1.0.4/* /usr/local/bin/
      - name: Build
        run: make
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokecrystal-rom
          path: pokecrystal.gbc
